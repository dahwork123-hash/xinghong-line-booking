function rows(){return db.bookings.filter(b=>(filter.office==='all'||b.officeId===filter.office)&&(filter.pool==='all'||job(b.jobId).pool===filter.pool)&&(filter.job==='all'||b.jobId===filter.job)&&(!filter.time||b.time===filter.time)&&(filter.status==='all'||b.status===filter.status)&&b.date>=filter.from&&b.date<=filter.to&&(!filter.search||[b.name,b.phone,b.id].some(s=>s.includes(filter.search))));}
function select(id,values,current){return `<select id="${id}">${values.map(([v,l])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}
function filters(){return `${filter.time?`<p class="muted">目前場次時間：${esc(filter.time)}；清除條件可返回全時段。</p>`:""}<div class="filters"><label>面試日期起<input id="f-from" type="date" value="${filter.from}"></label><label>面試日期迄<input id="f-to" type="date" value="${filter.to}"></label><label>面試分公司${select('f-office',[['all','全區'],...cfg.offices.map(o=>[o.id,o.city])],filter.office)}</label><label>分組${select('f-pool',[['all','全部分組'],['general','一般職缺'],['admin','行政']],filter.pool)}</label><label>職缺${select('f-job',[['all','全部職缺'],...cfg.jobs.map(j=>[j.id,j.label])],filter.job)}</label><label>狀態${select('f-status',[['all','全部'],['confirmed','已預約'],['cancelled','已取消']],filter.status)}</label><label>搜尋<input id="f-search" type="search" value="${esc(filter.search)}" placeholder="姓名、電話、預約編號"></label>${btn('查詢','filter')}${btn('清除條件','filter-reset')}</div>`;}
function table(headers,body){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}" class="empty">沒有符合資料</td></tr>`}</tbody></table></div>`;}

 if(tab==='detail'){const b=db.bookings.find(x=>x.id===selected);content=b?`<div class="split"><section><h2>${esc(b.name)}</h2><small>${esc(b.id)}</small>${summary(b)}<div class="actions">${btn('人工接手','handoff',b.uid)}${btn('返回名單','tab','bookings')}</div><div class="notice" style="margin-top:24px">系統內代約仍受5人上限。正式版會提供登入後的代約、改期與取消；此原型僅示範本人自助異動。</div></section><section><h2>預約異動歷程</h2><ul class="history">${b.events.map(e=>`<li><small>${esc(e.at)}</small><br>${esc(e.text)}</li>`).join('')}</ul></section></div>`:'<p>請從名單選擇預約。</p>';}
 if(tab==='handoff'){const ids=[...new Set([uid,...Object.keys(db.modes)])];content=`<div class="notice">先在此按「人工接手」，再回原 LINE 聊天；處理完按「恢復自動」。不是新的聊天收件匣，也不會自動同步原 LINE 全部人工對話。</div>${table(['求職者','最新狀態','接手同仁','異動時間','操作'],ids.map(id=>{const m=db.modes[id]||{},b=active(id)||db.bookings.find(b=>b.uid===id);return `<tr><td>${esc(b?.name||id.replace('DEMO-','示範求職者 '))}</td><td><span class="badge ${human(id)!=='auto'?'closed':''}">${({auto:'自動',human:'人工接手',pending_human:'待人工'})[human(id)]}</span></td><td>${esc(m.actor||'未接手')}</td><td>${esc(m.at||'—')}</td><td>${btn('人工接手','handoff',id)} ${btn('恢復自動','resume',id)}</td></tr>`;}).join(''))}<div class="block"><h3>操作順序</h3><p>1. 人工接手　2. 回原 LINE 聊天　3. 恢復自動</p><small>正式版每位同仁獨立登入；本機示範沒有登入權限與跨電腦同步。</small></div>`;}
 if(tab==='schedules'){const r=db.rules[ruleIndex];content=`<div class="split"><section><label>面試地／分組${select('rule-index',db.rules.map((r,i)=>[String(i),office(r.officeId).city+' · '+poolName(r.pool)]),String(ruleIndex))}</label><div class="block" style="margin-top:18px">${[1,2,3,4,5,6,7].map(d=>`<div class="schedule"><label for="day-${d}">星期${['','一','二','三','四','五','六','日'][d]}</label><input id="day-${d}" value="${esc((r.isoWeekdays[d]||[]).join('、'))}" aria-label="星期${d}時段"></div>`).join('')}</div><label>每組容量 <input id="capacity" type="number" min="1" max="99" value="${r.capacity}" style="width:90px"></label><div class="actions">${btn('預覽並發布','schedule-preview','','primary')}</div></section><section><h2>已核定規則</h2><dl class="summary"><dt>開放範圍</dt><dd>含今天14日</dd><dt>新約截止</dt><dd>提前1小時</dd><dt>一般分組</dt><dd>社宅顧問＋儲備主管共5人</dd><dt>行政分組</dt><dd>獨立5人，週三14:00，TOBY</dd><dt>系統外人工</dt><dd>不扣系統名額，現場合計超額可接受</dd></dl><div class="notice" style="margin-top:22px">原型發布立即影響本機新選項，不更改已有預約。正式版須加入生效日期、版本衝突與完整影響比對。</div></section></div>`;}
 if(tab==='templates'){const t=db.templates[templateKey];content=`<div class="split"><section><label>罐頭種類${select('template-key',cfg.templates.map(t=>[t.key,({salary_general:'一般薪資與工時',work_general:'一般工作內容',booking_success:'預約成功',office_taichung:'台中辦公室',office_nantou:'南投辦公室',human:'轉人工'})[t.key]||t.key]),templateKey)}</label><p style="margin-top:16px"><span class="badge">本機發布版 v${t.version}</span> <small>${t.status==='user_provided'?'使用者提供內容':'新文案草稿，正式上線前校稿'}</small></p><textarea id="template-text" rows="13">${esc(t.draft??t.text)}</textarea><div class="actions">${btn('儲存草稿','template-draft')}${btn('預覽發布','template-preview','','primary')}</div></section><section><h2>版本與適用範圍</h2><p>適用：${esc(t.scope)}</p><p class="muted">草稿不影響已發布的 FAQ。發布只改之後的回覆，不回寫已送訊息。行政薪資與工作內容未提供，轉人工。</p><h3>目前發布內容</h3><div class="bubble" style="background:#f1f6f2">${esc(t.text)}</div></section></div>`;}
 const title=({overview:'場次總覽',bookings:'預約查詢',detail:'預約明細',handoff:'人工接手',schedules:'時段與容量設定',templates:'罐頭訊息管理'})[tab];
 return `<div class="layout"><nav class="side"><strong>招募管理</strong><p><small>示範同仁 · 全區</small></p>${nav.map(([k,l])=>btn(l,'tab',k,tab===k?'active':'')).join('')}<div class="block"><small>全體授權同仁同權限<br>不做報到／未到<br>不做自動提醒</small></div></nav><section class="main"><div class="titlebar"><div><h1>${title}</h1><small>新系統預約紀錄，不含未登錄的人工預約 · 面試日期口徑</small></div><span class="badge">假資料／本機示範</span></div>${content}</section></div>`;}
function render(){$('#app').innerHTML=mode==='candidate'?candidateView():adminView();$('#identity').value=uid;$('#clock').value=new Date(now+28800000).toISOString().slice(0,16);}
function book(){if(human()!=='auto')return '人工接手中，自助操作暫停';const old=active();if(old&&!editing)return '已有一筆有效預約，請修改原預約';if(!form.name.trim()||!form.phone.trim())return '請先補齊姓名電話';const error=availability(form,editing?old?.id:null);if(error)return error;const stamp=new Date(now+28800000).toISOString().slice(0,16);const id=old&&editing?old.id:'DEMO-'+crypto.randomUUID().slice(0,8);const ok=persist(()=>{if(old&&editing){const before=old.date+' '+old.time;Object.assign(old,clone(form),{address:office(form.officeId).address});old.events.push({at:stamp,text:'改期：'+before+' → '+form.date+' '+form.time});}else db.bookings.push({...clone(form),id,uid,status:'confirmed',address:office(form.officeId).address,events:[{at:stamp,text:'本人確認預約'}]});audit('預約確認 '+id);});if(!ok)return '儲存失敗，未完成預約';editing=false;lastId=id;step='done';return '';}
function setHuman(id,m){return persist(()=>{db.modes[id]={mode:m,actor:m==='pending_human'?'求職者':'示範同仁',at:new Date(now+28800000).toISOString().slice(0,16)};audit(id+' '+m);});}
function start(){if(active()){step='booking';return;}editing=false;form.date='';form.time='';step='job';}
function applyFilters(){for(const k of Object.keys(filter)){const el=$('#f-'+k);if(el)filter[k]=el.value;}if(filter.from>filter.to){toast('起日不能晚於迄日');return;}render();}
document.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;
 if(mode==='candidate'&&human()!=='auto'&&!['mode','reset','booking','request-human','modal-close','modal-confirm'].includes(a)){step='human';render();return;}
 if(a==='mode'){mode=v;}
 if(a==='tab'){tab=v;if(v==='overview'){filter.job='all';delete filter.time;}}
 if(a==='step'){step=v;}
 if(a==='start')start();
 if(a==='booking'){step='booking';}
 if(a==='job'){form.jobId=v;step='city';}
 if(a==='city'){form.applyCity=v;if(form.jobId==='admin'){form.officeId='taichung';step='name';}else if(v==='南投'){step='nantou';}else{form.officeId=cfg.offices.find(o=>o.city===v).id;step='name';}}
 if(a==='office'){form.officeId=v;step='name';}
 if(a==='answer'){const val=$('#answer').value.trim();if(!val){toast('請填寫'+(step==='name'?'姓名':'電話'));return;}if(step==='phone'&&!/^\+?[0-9() -]{8,22}$/.test(val)){toast('請確認電話格式');return;}form[step]=val;step=step==='name'?'phone':'source';}
 if(a==='source'){form.source=v;step='date';}
 if(a==='date'){form.date=v;step='time';}
 if(a==='time'){form.time=v;step='review';}
 if(a==='confirm'){const error=book();if(error)toast(error);}
 if(a==='reschedule'){const old=active();if(old){form={...clone(old)};editing=true;step='date';}}
 if(a==='cancel'){const b=active();if(!b){toast('已開始或沒有可取消的預約');return;}if(persist(()=>{b.status='cancelled';b.events.push({at:new Date(now+28800000).toISOString().slice(0,16),text:'本人確認取消'});audit('取消 '+b.id);})){lastId=b.id;step='cancelled';}}
 if(a==='parse'){const source=$('#paste').value;const fields={};for(const m of source.matchAll(/【([^】]+)】\s*[:：;；]?\s*([^【\r\n]*)/g))fields[m[1]]=m[2].trim();form.name=fields['姓名']||'';form.phone=fields['連絡電話']||fields['聯絡電話']||'';const j=cfg.jobs.find(j=>j.label===(fields['應徵職務']||fields['收到應徵職務名稱']));const city=fields['應徵縣市'];if(!j||!cfg.applicationCities.includes(city)){step='job';toast('職缺或應徵地需重新選擇，已保留姓名電話');}else{form.jobId=j.id;form.applyCity=city;form.officeId=j.id==='admin'?'taichung':city==='南投'?'taichung':cfg.offices.find(o=>o.city===city).id;step=city==='南投'&&j.id!=='admin'?'nantou':'name';toast('已辨識必要欄位，請核對姓名電話');}}
 if(a==='faq'){if(form.jobId==='admin'){setHuman(uid,'pending_human');step='human';}else{templateKey=v;step='faq-answer';}}
 if(a==='continue'){if(active())step='booking';else step=form.name&&form.phone?'date':'job';}
 if(a==='request-human'){if(human()==='auto')setHuman(uid,'pending_human');step='human';}
 if(a==='handoff'){if(setHuman(v,'human'))toast('已暫停該人的自動操作，請回原 LINE 聊天');}
 if(a==='resume'){if(setHuman(v,'auto'))toast('已恢復自動');}
 if(a==='detail'){selected=v;tab='detail';}
 if(a==='group'){const[o,d,t,p]=v.split('|');filter={...filter,office:o,pool:p,job:'all',from:d,to:d,time:t,status:'confirmed',search:''};tab='bookings';toast('已篩選此場次，面試時間 '+t);}
 if(a==='filter'){applyFilters();return;}
 if(a==='filter-reset'){filter={office:'all',pool:'all',job:'all',status:'all',search:'',from:localDate(now),to:localDate(now+13*86400000)};}
 if(a==='close-slot'){const isClosed=db.closed.includes(v),affected=db.bookings.filter(b=>b.status==='confirmed'&&groupKey(b)===v);modal(isClosed?'重新開放場次':'關閉場次',`<p>${esc(v)}</p><p>目前 ${affected.length} 筆有效預約仍保留。${isClosed?'恢復後仍依容量與截止限制。':'關閉後不可新約；由同仁回原 LINE 逐一通知。'}</p><p>${affected.map(b=>esc(b.name)).join('、')}</p>`,()=>{persist(()=>{db.closed=isClosed?db.closed.filter(k=>k!==v):[...db.closed,v];audit((isClosed?'開放 ':'關閉 ')+v);});});return;}
 if(a==='schedule-preview'){const draft=clone(db.rules[ruleIndex]);try{for(let d=1;d<=7;d++){const vals=$('#day-'+d).value.split(/[,，、\s]+/).filter(Boolean);if(vals.some(t=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)))throw Error('請以 HH:mm 輸入時間');draft.isoWeekdays[d]=[...new Set(vals)].sort();}draft.capacity=Number($('#capacity').value);if(!Number.isInteger(draft.capacity)||draft.capacity<1||draft.capacity>99)throw Error('容量請填1～99');}catch(e){toast(e.message);return;}const affected=db.bookings.filter(b=>b.status==='confirmed'&&b.officeId===draft.officeId&&job(b.jobId).pool===draft.pool&&(!(draft.isoWeekdays[day(b.date)]||[]).includes(b.time)||count(b)>draft.capacity));modal('發布時段與容量',`<p>${office(draft.officeId).city} · ${poolName(draft.pool)} · 每組 ${draft.capacity} 人</p><p>受移除時段或降低容量影響：${affected.length} 筆；既有預約全部保留。</p><p>${affected.map(b=>esc(b.name+' '+b.date+' '+b.time)).join('<br>')||'無既有預約受影響。'}</p><small>此示範立即套用本機新選項。正式版須選生效日期及核對場次。</small>`,()=>{persist(()=>{db.rules[ruleIndex]=draft;audit('發布排程 '+draft.officeId+' '+draft.pool);});});return;}
 if(a==='template-draft'){persist(()=>{db.templates[templateKey].draft=$('#template-text').value;});toast('已存草稿，尚未發布');}
 if(a==='template-preview'){const value=$('#template-text').value,t=db.templates[templateKey],required=t.requiredVariables||[],known=[...required,'field'];if(!value.trim()||required.some(k=>!value.includes('{{'+k+'}}'))||[...value.matchAll(/{{([^}]+)}}/g)].some(m=>!known.includes(m[1]))){toast('內容空白、必要變數缺漏或未知變數，無法發布');return;}modal('發布罐頭 v'+(t.version+1),`<div class="bubble">${esc(value)}</div><p><small>不改已送訊息；新文案仍需公司上線前校稿。</small></p>`,()=>{persist(()=>{t.text=value;t.draft=value;t.version++;audit('發布罐頭 '+templateKey);});});return;}
 if(a==='modal-close'){closeModal();return;}
 if(a==='modal-confirm'){const fn=modalAction;closeModal();if(fn)fn();}
 if(a==='reset'){modal('重設本機示範','<p>只清除此原型的假資料及本機設定，不影響任何正式帳號。</p>',()=>{db=seed();save();uid='DEMO-A';now=dt('2026-09-07','09:00');step='home';editing=false;lastId=null;filter={office:'all',pool:'all',job:'all',status:'all',search:'',from:'2026-09-07',to:'2026-09-20'};form={jobId:'housing_advisor',applyCity:'台中',officeId:'taichung',name:'',phone:'',source:'未知',date:'',time:''};});return;}
 render();});
document.addEventListener('change',e=>{if(e.target.id==='identity'){uid=e.target.value;step='home';editing=false;lastId=null;form.name='';form.phone='';render();}if(e.target.id==='clock'){const t=new Date(e.target.value+':00+08:00').getTime();if(Number.isFinite(t)){now=t;render();}}if(e.target.id==='rule-index'){ruleIndex=Number(e.target.value);render();}if(e.target.id==='template-key'){templateKey=e.target.value;render();}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)||seed();render();}catch{toast('本機資料格式錯誤，請重設示範');}}});
window.demo={snapshot:()=>clone({db,form,uid,mode,step,tab,now}),show:(s,opts={})=>{step=s;if(opts.mode)mode=opts.mode;if(opts.tab)tab=opts.tab;if(opts.form)Object.assign(form,opts.form);if(opts.selected)selected=opts.selected;if(opts.uid)uid=opts.uid;render();},setClock:n=>{now=new Date(n).getTime();render();},availability:s=>availability(s),commit:()=>{const e=book();render();return e;},reset:()=>{db=seed();save();uid='DEMO-A';mode='candidate';step='home';editing=false;lastId=null;now=dt('2026-09-07','09:00');form={jobId:'housing_advisor',applyCity:'台中',officeId:'taichung',name:'',phone:'',source:'未知',date:'',time:''};filter={office:'all',pool:'all',job:'all',status:'all',search:'',from:'2026-09-07',to:'2026-09-20'};render();}};
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
render();
</script></body></html>
